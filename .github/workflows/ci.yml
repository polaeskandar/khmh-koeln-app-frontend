name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: task check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0

      - run: task setup

      - run: task api:types
      - run: git diff --exit-code src/lib/api/schema.d.ts

      - run: pnpm audit --prod --audit-level high

      - run: task lint
      - run: task format:check
      - run: task typecheck
      - run: task test

      - run: task build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_IMPRESSUM_URL: ${{ vars.NEXT_PUBLIC_IMPRESSUM_URL || 'https://example.org/impressum' }}
          NEXT_TELEMETRY_DISABLED: 1

      - run: pnpm exec cap sync android
      - run: git diff --exit-code

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm package

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.sha }}
          path: |
            web-${{ github.sha }}.tar.gz
            web-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
