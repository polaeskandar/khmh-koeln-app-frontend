version: "3"

tasks:
  setup:
    desc: Install the dependencies exactly as locked
    cmds:
      - pnpm install --frozen-lockfile

  dev:
    desc: Start the dev server on http://localhost:3000
    cmds:
      - pnpm dev

  lint:
    desc: Lint with ESLint
    cmds:
      - pnpm lint

  format:
    desc: Format with Prettier
    cmds:
      - pnpm format

  format:check:
    desc: Check the formatting without changing files
    cmds:
      - pnpm format:check

  api:types:
    desc: Generate src/lib/api/schema.d.ts from openapi/openapi.json
    cmds:
      - pnpm api:types

  typecheck:
    desc: Type-check with TypeScript
    cmds:
      - pnpm typecheck

  test:
    desc: Run the Vitest tests
    cmds:
      - pnpm test

  build:
    desc: Build the static export to out/
    cmds:
      - pnpm build

  package:
    desc: Build, then package out/ as web-<sha>.tar.gz with its .sha256 (docs/deployment.md)
    cmds:
      - task: build
      - pnpm package

  cap:sync:
    desc: Build, then copy out/ and the plugins into ios/ and android/
    cmds:
      - pnpm cap:sync

  check:
    desc: Run CI's checks (lint, formatting, types, tests, build)
    cmds:
      - task: lint
      - task: format:check
      - task: typecheck
      - task: test
      - task: build
