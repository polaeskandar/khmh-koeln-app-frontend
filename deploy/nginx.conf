log_format khmk '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log khmk;
    error_log /var/log/nginx/error.log crit;
    log_not_found off;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /_next/static/ {
        include /etc/nginx/khmk/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ \.txt$ {
        include /etc/nginx/khmk/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        error_page 404 = @missing_text;
    }

    location @missing_text {
        include /etc/nginx/khmk/security-headers.conf;
        default_type text/plain;
        return 404 "Not found\n";
    }

    location / {
        include /etc/nginx/khmk/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
